  <!-- before first paint (JS only): intro words hidden until the font is ready, work hidden until the first scroll.
       is-loading = play the load animation (work/loader.js): once per tab, never with reduced motion or ?work;
       ?loader forces it (testing) -->
  <script>
    (function () {
      var d = document.documentElement, q = location.search;
      d.classList.add("intro-pre", "is-intro");
      try { if (sessionStorage.getItem("rt")) d.classList.add("rt-in"); } catch (e) {}
      try {
        if (q.indexOf("work") < 0 && !matchMedia("(prefers-reduced-motion: reduce)").matches &&
            (q.indexOf("loader") >= 0 || !sessionStorage.getItem("sg-loaded"))) d.classList.add("is-loading");
      } catch (e) {}
    })();
  </script>

<body>
  <!-- load animation (work/loader.js); only shown while html.is-loading -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="ld-bg"></div>
    <div class="ld-logo"></div>
  </div>

  <!-- Home = intro (Figma 328:1008) + work (171:24979 / 307:7505 / 308:7612 / 324:435) on one 100vh page.
       The first scroll lifts the intro away and the work rises in (work/work.js). -->
  <div class="frame">
    <site-navbar></site-navbar>
  </div>

  <main class="work">
    <!-- the cards + glass portal are drawn here (WebGL) -->
    <div class="work-stage" id="stage"></div>

    <!-- Archives card, live: overlays the canvas while Archives is centred, for the footer's hover scene -->
    <a class="work-archives" id="archives" href="#" aria-label="Archives" hidden>
      <span class="ft-archives-art"></span>
    </a>

    <!-- left: project dial (Figma 173:25024), turns like a clock with the cards -->
    <nav class="work-dial" id="dial" aria-label="Projects"></nav>

    <!-- hover cursor over the centre image (Figma 327:1006) -->
    <div class="work-cursor" id="cursor" aria-hidden="true">
      <img src="work/content/cursor-hand.webp" width="30" height="30" alt="">
      <span>See the work</span>
    </div>

    <!-- right: project details (Figma 173:25036), swapped per card -->
    <section class="work-info" id="info" aria-live="polite"></section>

    <!-- intro (Figma 328:1008). Outer divs position, inner [data-intro] elements animate -->
    <section class="intro" id="intro" aria-label="Introduction">
      <!-- three faint ASCII jellyfish drifting behind the intro text (work/jellies.js) -->
      <canvas class="intro-jellies" aria-hidden="true"></canvas>
      <div class="intro-pill"><p data-intro>Based in Kerala, India</p></div>
      <div class="intro-text"><p data-intro>I’m a Design Enthusiast who loves working with digital experience and understanding human behaviour</p></div>
      <div class="intro-hint">
        <button type="button" id="introHint" data-intro>
          <span>(Scroll to see work)</span>
          <img src="work/content/scroll-mouse.svg" width="22" height="29" alt="">
        </button>
      </div>
    </section>
  </main>
</body>
